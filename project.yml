name: LocalDictationIOS
options:
  bundleIdPrefix: com.jackzoppa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: Q4MSNRURZ4
    CODE_SIGN_STYLE: Automatic
targets:
  LocalDictation:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - LocalDictation.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackzoppa.LocalDictation
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/LocalDictation.entitlements
        PRODUCT_NAME: LocalDictation
        INFOPLIST_KEY_CFBundleDisplayName: Local Dictation
        DEVELOPMENT_TEAM: Q4MSNRURZ4
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/LocalDictation.entitlements
    dependencies:
      - target: LocalDictationKeyboard
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Local Dictation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.jackzoppa.LocalDictation
            CFBundleURLSchemes:
              - localdictation
        NSMicrophoneUsageDescription: Local Dictation records your voice on this iPhone so it can turn speech into text. Audio stays on the device and is discarded after each dictation.
        NSSpeechRecognitionUsageDescription: Local Dictation uses on-device speech recognition to convert what you say into text.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
  LocalDictationKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - Info.plist
          - LocalDictationKeyboard.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackzoppa.LocalDictation.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/LocalDictationKeyboard.entitlements
        PRODUCT_NAME: LocalDictationKeyboard
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Local Dictation
        DEVELOPMENT_TEAM: Q4MSNRURZ4
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Keyboard/LocalDictationKeyboard.entitlements
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Local Dictation
        CFBundleName: Local Dictation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: Local Dictation records your voice so it can insert text in the current app.
        NSSpeechRecognitionUsageDescription: Local Dictation uses on-device speech recognition inside the keyboard.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
schemes:
  LocalDictation:
    build:
      targets:
        LocalDictation: all
        LocalDictationKeyboard: all
    run:
      config: Debug
