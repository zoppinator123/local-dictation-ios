name: LocalDictationIOS
options:
  bundleIdPrefix: com.jackzoppa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.38"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: Q4MSNRURZ4
    CODE_SIGN_STYLE: Automatic
targets:
  LocalDictation:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - LocalDictation.entitlements
      - path: Shared
      - path: Resources/Models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackzoppa.LocalDictation
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/LocalDictation.entitlements
        PRODUCT_NAME: LocalDictation
        INFOPLIST_KEY_CFBundleDisplayName: Local Dictation
        DEVELOPMENT_TEAM: Q4MSNRURZ4
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/LocalDictation.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jackzoppa.LocalDictation
        keychain-access-groups:
          - Q4MSNRURZ4.com.jackzoppa.LocalDictation.shared
    dependencies:
      - target: LocalDictationKeyboard
        embed: true
      - package: WhisperKit
        product: WhisperKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Local Dictation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.jackzoppa.LocalDictation
            CFBundleURLSchemes:
              - localdictation
        NSMicrophoneUsageDescription: Local Dictation records your voice on this iPhone so it can turn speech into text. Audio is discarded after each dictation.
        NSSpeechRecognitionUsageDescription: Local Dictation uses on-device Apple Speech Recognition only if its bundled offline Whisper model cannot transcribe.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  LocalDictationKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - Info.plist
          - LocalDictationKeyboard.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackzoppa.LocalDictation.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/LocalDictationKeyboard.entitlements
        PRODUCT_NAME: LocalDictationKeyboard
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Local Dictation
        DEVELOPMENT_TEAM: Q4MSNRURZ4
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Keyboard/LocalDictationKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jackzoppa.LocalDictation
        keychain-access-groups:
          - Q4MSNRURZ4.com.jackzoppa.LocalDictation.shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Local Dictation
        CFBundleName: Local Dictation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Local Dictation records your voice so it can insert text in the current app.
        NSSpeechRecognitionUsageDescription: Local Dictation uses on-device Apple Speech Recognition only if its bundled offline Whisper model cannot transcribe.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  LocalDictationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackzoppa.LocalDictationUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LocalDictation
        DEVELOPMENT_TEAM: Q4MSNRURZ4
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: LocalDictation
schemes:
  LocalDictation:
    build:
      targets:
        LocalDictation: all
        LocalDictationKeyboard: all
        LocalDictationUITests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalDictationUITests
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
